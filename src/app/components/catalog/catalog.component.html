<div class="container my-5">
  <div class="row">
    <div class="col-md-12">
      <h1 class="mb-4">Catálogo de Productos</h1>
      
      <div class="filter-section mb-4">
        <button class="btn btn-outline-secondary me-2" 
          [class.active]="selectedCategory === ''" 
          (click)="filterByCategory('')">
          Todos
        </button>
        <button class="btn btn-outline-secondary me-2" 
          [class.active]="selectedCategory === 'remeras'" 
          (click)="filterByCategory('remeras')">
          Remeras
        </button>
        <button class="btn btn-outline-secondary me-2" 
          [class.active]="selectedCategory === 'pantalones'" 
          (click)="filterByCategory('pantalones')">
          Pantalones
        </button>
        <button class="btn btn-outline-secondary me-2" 
          [class.active]="selectedCategory === 'calzado'" 
          (click)="filterByCategory('calzado')">
          Calzado
        </button>
        <button class="btn btn-outline-secondary" 
          [class.active]="selectedCategory === 'camperas'" 
          (click)="filterByCategory('camperas')">
          Camperas
        </button>
      </div>

      <div class="row g-4">
        <div class="col-md-4 col-sm-6" *ngFor="let product of filteredProducts">
          <div class="card h-100 product-card">
            <img [src]="product.image" class="card-img-top" [alt]="product.name">
            <div class="card-body">
              <h5 class="card-title">{{ product.name }}</h5>
              <p class="card-text text-muted small">{{ product.description }}</p>
              <h6 class="card-price mb-3">${{ product.price | number:'1.2-2' }}</h6>
            </div>
            <div class="card-footer bg-white border-top-0">
              <button class="btn btn-primary w-100" (click)="addToCart(product)">
                <i class="bi bi-plus-circle"></i> Agregar al Carrito
              </button>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="filteredProducts.length === 0" class="alert alert-info mt-4">
        No hay productos en esta categoría.
      </div>
    </div>
  </div>
</div>
